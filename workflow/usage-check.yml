name: usage-check

# Reads your Claude plan usage by running the official Claude Code CLI
# with a one-line Haiku prompt and saving its rate-limit event to usage.json.
# Uses ONLY the official CLI with your own token from the repo secret
# CLAUDE_CODE_OAUTH_TOKEN (create it with `claude setup-token`). It never calls
# usage endpoints directly. Edit the cron times to run ~30-90 min before your
# scheduled agent runs (cron is UTC; GitHub often starts scheduled runs late,
# so agents should also use the on-demand refresh: push .github/usage-request).
on:
  schedule:
    - cron: "5 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/usage-request"]

permissions:
  contents: write

concurrency:
  group: usage-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read plan usage via Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npx -y @anthropic-ai/claude-code@latest -p "Reply with OK" \
            --model haiku --max-turns 1 \
            --output-format stream-json --verbose > /tmp/out.jsonl 2>/dev/null || true
          python3 scripts/parse_usage.py /tmp/out.jsonl > usage.json
          cat usage.json

      - name: Commit usage.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage.json
          git diff --cached --quiet && exit 0
          git commit -m "usage check $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
